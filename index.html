<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#30343b"><title>TaskYUL</title><link rel="stylesheet" href="app.css"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TaskYUL"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head><body><div class="shell"><aside class="sidebar"><div class="brand">Task<span>YUL</span><small>ЛИЧНОЕ ПРОСТРАНСТВО</small></div><nav id="nav" aria-label="Разделы"></nav><div class="local-status">На этом устройстве<small>Облачная синхронизация не подключена</small></div></aside><main><header class="top"><div><div class="eyebrow" id="todayLabel"></div><h1 id="pageTitle">Обзор</h1></div><button class="primary" data-action="new-task">＋ Новая задача</button></header><div id="content"></div></main></div><dialog id="editor"><form id="taskForm"><div class="section-head"><h2 id="editorTitle">Новая задача</h2><button type="button" data-action="close-editor" aria-label="Закрыть">✕</button></div><input name="id" type="hidden"><label>Название<input name="title" required maxlength="500"></label><div class="form-grid"><label>Проект<select name="project"></select></label><label>Ответственный<input name="owner" placeholder="Имя, без аккаунта"></label><label>Срочность<select name="priority"><option value="normal">Обычная</option><option value="high">Важная</option><option value="urgent">Срочно</option></select></label><label>Срок<select name="dueType"><option value="none">Без срока</option><option value="date">Точная дата</option><option value="week">На выбранной неделе</option></select></label><label>Дата / день нужной недели<input name="date" type="date"></label><label>Время начала<input name="time" type="time"></label><label>Время окончания<input name="endTime" type="time"></label><label>Напоминание (часов до срока)<input name="reminder" type="number" min="0" max="8760" placeholder="Например, 24"></label></div><label class="inline"><input name="watch" type="checkbox"> Выделять цветом приближение дедлайна</label><label>Описание<textarea name="description" rows="3"></textarea></label><p class="muted">Напоминания сохраняются в карточке; системные уведомления пока не подключены.</p><div class="actions"><button type="button" data-action="close-editor">Отмена</button><button class="primary" type="submit">Сохранить задачу</button></div></form></dialog><dialog id="preview"><div class="section-head"><h2 id="previewTitle">Файл</h2><button data-action="close-preview" aria-label="Закрыть файл">✕</button></div><div id="previewBody"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="model.js"></script><script src="app.js"></script><script src="backup.js"></script><script src="pwa.js"></script></body></html>
